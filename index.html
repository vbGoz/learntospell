            },
            stats: {
                totalWordsAttempted: 0,
                totalCorrect: 0,
                bestStreak: 0,
                sessionCount: 1,
                lastPlayed: new Date().toISOString()
            },
            wordHistory: {}, // { wordName: { attempts: 0, correct: 0, lastAttempt: timestamp } }
            achievements: [],
            unlockedAchievements: []
        });

        // Achievement definitions
        const ACHIEVEMENTS = [
            {
                id: 'first-steps',
                name: 'First Steps',
                description: 'Complete your first word',
                icon: '👣',
                check: (userData) => userData.stats.totalWordsAttempted >= 1
            },
            {
                id: 'perfect-10',
                name: 'Perfect 10',
                description: 'Get 10 correct answers in a row',
                icon: '🔥',
                check: (userData) => userData.stats.bestStreak >= 10
            },
            {
                id: 'century-club',
                name: 'Century Club',
                description: 'Attempt 100 words',
                icon: '💯',
                check: (userData) => userData.stats.totalWordsAttempted >= 100
            },
            {
                id: 'half-century',
                name: 'Half Century',
                description: 'Get 50 words correct',
                icon: '⭐',
                check: (userData) => userData.stats.totalCorrect >= 50
            },
            {
                id: 'perfect-session',
                name: 'Perfect Session',
                description: 'Complete 10 words with 100% accuracy',
                icon: '✨',
                check: (userData) => {
                    let perfectStreak = 0;
                    let maxPerfectStreak = 0;
                    Object.values(userData.wordHistory).forEach(word => {
                        if (word.attempts > 0 && word.correct === word.attempts) {
                            perfectStreak++;
                            maxPerfectStreak = Math.max(maxPerfectStreak, perfectStreak);
                        } else if (word.attempts > 0) {
                            perfectStreak = 0;
                        }
                    });
                    return maxPerfectStreak >= 10;
                }
            },
            {
                id: 'polyglot',
                name: 'Polyglot',
                description: 'Master 10 words with special characters',
                icon: '🌍',
                check: (userData) => {
                    // Words with accents, hyphens, or spaces
                    const specialWords = WORDS.filter(w => /[^a-z]/i.test(w));
                    let mastered = 0;
                    specialWords.forEach(word => {
                        const history = userData.wordHistory[word];
                        if (history && history.attempts > 0) {
                            const accuracy = history.correct / history.attempts;
                            if (accuracy >= 0.8 && history.correct >= 3) {
                                mastered++;
                            }
                        }
                    });
                    return mastered >= 10;
                }
            },
            {
                id: 'scholar',
                name: 'Scholar',
                description: 'Master 50 words',
                icon: '📚',
                check: (userData) => {
                    const masteryStats = getMasteryStats(userData, WORDS);
                    return masteryStats.mastered >= 50;
                }
            },
            {
                id: 'dictionary',
                name: 'Dictionary Master',
                description: `Master all ${WORDS.length} words`,
                icon: '📖',
                check: (userData) => {
                    const masteryStats = getMasteryStats(userData, WORDS);
                    return masteryStats.mastered >= WORDS.length;
                }
            },
            {
                id: 'consistent-learner',
                name: 'Consistent Learner',
                description: 'Practice on 7 different days',
                icon: '📅',
                check: (userData) => {
                    return userData.stats.sessionCount >= 7;
                }
            },
            {
                id: 'quick-study',
                name: 'Quick Study',
                description: 'Get 20 words correct',
                icon: '⚡',
                check: (userData) => userData.stats.totalCorrect >= 20
            }
        ];

        const checkAchievements = (userData) => {
            const newlyUnlocked = [];
            ACHIEVEMENTS.forEach(achievement => {
                const alreadyUnlocked = (userData.unlockedAchievements || []).includes(achievement.id);
                if (!alreadyUnlocked && achievement.check(userData)) {
                    newlyUnlocked.push(achievement);
                    if (!userData.unlockedAchievements) {
                        userData.unlockedAchievements = [];
                    }
                    userData.unlockedAchievements.push(achievement.id);
                }
            });
            return newlyUnlocked;
        };

        const getDefaultAppData = () => ({
            profiles: [],
            currentProfileId: null,
            profileData: {}
        });

        const loadAppData = () => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    // Migrate old single-user data to profile system
                    if (!data.profiles) {
                        const profileId = generateId();
                        return {
                            profiles: [{
                                id: profileId,
                                name: 'Player 1',
                                avatar: AVATAR_EMOJIS[0],
                                color: PROFILE_COLORS[0],
                                createdAt: new Date().toISOString()
                            }],
                            currentProfileId: profileId,
                            profileData: {
                                [profileId]: data
                            }
                        };
                    }
                    return data;
                }
            } catch (error) {
                console.error('Failed to load app data:', error);
            }
            return getDefaultAppData();
        };

        const saveAppData = (appData) => {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (error) {
                console.error('Failed to save app data:', error);
            }
        };

        const loadUserData = (appData) => {
            if (!appData.currentProfileId) return getDefaultUserData();
            const userData = appData.profileData[appData.currentProfileId];
            if (!userData) return getDefaultUserData();
            const merged = { ...getDefaultUserData(), ...userData };
            // Saved levels from older word lists no longer exist; fall back to all words
            const level = merged.settings?.difficulty;
            if (level !== 'all' && !Object.hasOwn(WORD_LEVELS, level)) {
                merged.settings = { ...merged.settings, difficulty: 'all' };
            }
            return merged;
        };

        const saveUserData = (appData, userData) => {
            if (!appData.currentProfileId) return;
            appData.profileData[appData.currentProfileId] = userData;
            saveAppData(appData);
        };

        const createProfile = (appData, name, avatar, color) => {
            const profileId = generateId();
            const profile = {
                id: profileId,
                name: name,
                avatar: avatar,
                color: color,
                createdAt: new Date().toISOString()
            };
            appData.profiles.push(profile);
            appData.profileData[profileId] = getDefaultUserData();
            appData.currentProfileId = profileId;
            saveAppData(appData);
            return appData;
        };

        const switchProfile = (appData, profileId) => {
            appData.currentProfileId = profileId;
            saveAppData(appData);
            return appData;
        };

        const deleteProfile = (appData, profileId) => {
            appData.profiles = appData.profiles.filter(p => p.id !== profileId);
            delete appData.profileData[profileId];
            if (appData.currentProfileId === profileId) {
                appData.currentProfileId = appData.profiles.length > 0 ? appData.profiles[0].id : null;
            }
            saveAppData(appData);
            return appData;
        };

        const updateWordHistory = (userData, word, isCorrect) => {
            const wordHistory = { ...userData.wordHistory };
            if (!wordHistory[word]) {
                wordHistory[word] = { attempts: 0, correct: 0, lastAttempt: null };
            }
            wordHistory[word].attempts += 1;
            if (isCorrect) {
                wordHistory[word].correct += 1;
            }
            wordHistory[word].lastAttempt = new Date().toISOString();
            return wordHistory;
        };

        const getMissedWords = (userData, allWords) => {
            return allWords.filter(word => {
                const history = userData.wordHistory[word];
                if (!history || history.attempts === 0) return false; // Not attempted yet
                const accuracy = history.correct / history.attempts;
                return accuracy < 0.5; // Less than 50% accuracy
            });
        };

        const getMasteryStats = (userData, allWords) => {
            let mastered = 0;
            let practiced = 0;
            let needsPractice = 0;

            allWords.forEach(word => {
                const history = userData.wordHistory[word];
                if (!history || history.attempts === 0) return;

                practiced++;
                const accuracy = history.correct / history.attempts;

                if (accuracy >= 0.8 && history.correct >= 3) {
                    mastered++; // 80%+ accuracy and at least 3 correct
                } else if (accuracy < 0.5) {
                    needsPractice++;
                }
            });

            return {
                mastered,
                practiced,
                needsPractice,
                notPracticed: allWords.length - practiced
            };
        };

        function SpellingApp() {
            const [mode, setMode] = useState('profile-selector');
            const [currentWordIndex, setCurrentWordIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [wordsAttempted, setWordsAttempted] = useState(0);
            const [shuffledWords, setShuffledWords] = useState([]);
            const [scrambledLetters, setScrambledLetters] = useState([]);
            const [selectedLetters, setSelectedLetters] = useState([]);
            const [multipleChoiceOptions, setMultipleChoiceOptions] = useState([]);
            const [difficultyFilter, setDifficultyFilter] = useState('all');
            const [appData, setAppData] = useState(loadAppData());
            const [userData, setUserData] = useState(() => loadUserData(loadAppData()));
            const [newAchievements, setNewAchievements] = useState([]);
            const [showCreateProfile, setShowCreateProfile] = useState(false);
            const [newProfileName, setNewProfileName] = useState('');
            const [selectedAvatar, setSelectedAvatar] = useState(AVATAR_EMOJIS[0]);
            const [selectedColor, setSelectedColor] = useState(PROFILE_COLORS[0]);
            const inputRef = useRef(null);
            const audioRef = useRef(null); // Track current audio

            // Check if we should show profile selector or home
            useEffect(() => {
                const data = loadAppData();
                if (data.profiles.length === 0 || !data.currentProfileId) {
                    setMode('profile-selector');
                } else {
                    setMode('home');
                }
            }, []);

            // Load saved difficulty preference on mount
            useEffect(() => {
                const data = loadUserData(appData);
                setDifficultyFilter(data.settings.difficulty);
            }, [appData]);

            useEffect(() => {
                const filtered = filterWordsByDifficulty(WORDS, difficultyFilter);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5);
                setShuffledWords(shuffled);
                setCurrentWordIndex(0);
            }, [mode, difficultyFilter]);

            useEffect(() => {
                if (feedback !== null) return; // Don't play audio when showing feedback
                if (shuffledWords.length === 0) return; // Don't play if no words loaded

                let timer;

                if (mode === 'unscramble') {
                    const word = shuffledWords[currentWordIndex];
                    const letters = word.split('').sort(() => Math.random() - 0.5);
                    setScrambledLetters(letters.map((l, i) => ({ letter: l, id: i })));
                    timer = setTimeout(() => speakWord(word), 500);
                } else if (mode === 'multiple-choice') {
                    const word = shuffledWords[currentWordIndex];
                    const distractors = generateDistractors(word);
                    const allOptions = [word, ...distractors].sort(() => Math.random() - 0.5);
                    setMultipleChoiceOptions(allOptions);
                    timer = setTimeout(() => speakWord(word), 500);
                } else if (mode === 'listen' || mode === 'practice') {
                    timer = setTimeout(() => speakWord(shuffledWords[currentWordIndex]), 500);
                }

                // Focus input for listen/practice modes
                if ((mode === 'listen' || mode === 'practice') && inputRef.current) {
                    inputRef.current.focus();
                }

                return () => {
                    if (timer) clearTimeout(timer);
                };
            }, [currentWordIndex, mode, shuffledWords, feedback]);

            useEffect(() => {
                const handleKeyPress = (e) => {
                    if (mode === 'unscramble' && e.key === 'Enter') {
                        if (feedback) continueToNext();
                        else if (selectedLetters.length > 0) checkUnscramble();
                    }
                };
                window.addEventListener('keypress', handleKeyPress);
                return () => window.removeEventListener('keypress', handleKeyPress);
            }, [mode, selectedLetters, feedback]);

            const filterWordsByDifficulty = (words, difficulty) =>
                Object.hasOwn(WORD_LEVELS, difficulty) ? WORD_LEVELS[difficulty] : words;

            // Generate plausible wrong answers (distractors) for multiple choice
            const generateDistractors = (correctWord) => {
                const distractors = new Set();
                const word = correctWord.toLowerCase();

                // Strategy 1: Swap common vowels
                const vowelSwaps = { 'a': ['e', 'o'], 'e': ['a', 'i'], 'i': ['e', 'y'], 'o': ['a', 'u'], 'u': ['o', 'oo'] };
                for (let i = 0; i < word.length; i++) {
                    if (vowelSwaps[word[i]]) {
                        vowelSwaps[word[i]].forEach(swap => {
                            const distractor = word.slice(0, i) + swap + word.slice(i + 1);
                            if (distractor !== word) distractors.add(distractor);
                        });
                    }
                }

                // Strategy 2: Double or undouble consonants
                for (let i = 0; i < word.length - 1; i++) {
                    const char = word[i];
                    if (!/[aeiou]/.test(char)) {
                        // Double a consonant
                        if (word[i] !== word[i + 1]) {
                            const distractor = word.slice(0, i + 1) + char + word.slice(i + 1);
                            distractors.add(distractor);
                        }
                        // Undouble a consonant
                        if (word[i] === word[i + 1]) {
                            const distractor = word.slice(0, i) + word.slice(i + 1);
                            distractors.add(distractor);
                        }
                    }
                }

                // Strategy 3: Transpose adjacent letters
                for (let i = 0; i < word.length - 1; i++) {
                    const distractor = word.slice(0, i) + word[i + 1] + word[i] + word.slice(i + 2);
                    if (distractor !== word) distractors.add(distractor);
                }

                // Strategy 4: Common spelling confusions
                const confusions = [
                    ['ie', 'ei'], ['ei', 'ie'], ['ph', 'f'], ['f', 'ph'],
                    ['c', 'k'], ['k', 'c'], ['s', 'c'], ['c', 's'],
                    ['tion', 'sion'], ['sion', 'tion'], ['ence', 'ance'], ['ance', 'ence']
                ];
                confusions.forEach(([from, to]) => {
                    if (word.includes(from)) {
                        const distractor = word.replace(from, to);
                        if (distractor !== word) distractors.add(distractor);
                    }
                });

                // Strategy 5: Remove or add silent letters
                const silentPatterns = ['e$', 'ue$', 'gh', 'kn', 'wr'];
                silentPatterns.forEach(pattern => {
                    if (word.match(new RegExp(pattern))) {
                        const distractor = word.replace(new RegExp(pattern), '');
                        if (distractor !== word && distractor.length > 2) distractors.add(distractor);
                    }
                });

                // Convert back to original case
                const cased = Array.from(distractors).map(d => {
                    if (correctWord[0] === correctWord[0].toUpperCase()) {
                        return d.charAt(0).toUpperCase() + d.slice(1);
                    }
                    return d;
                });

                // Return 3 unique distractors
                return cased.slice(0, 3);
            };

            // Convert word to filename
            const getAudioFilename = (word) => {
                return word.toLowerCase()
                    .replace(/[àáâãäå]/g, 'a')
                    .replace(/[èéêë]/g, 'e')
                    .replace(/[ìíîï]/g, 'i')
                    .replace(/[òóôõö]/g, 'o')
                    .replace(/[ùúûü]/g, 'u')
                    .replace(/[ñ]/g, 'n')
                    .replace(/[ç]/g, 'c')
                    .replace(/[ä]/g, 'a')
                    .replace(/[ö]/g, 'o')
                    .replace(/[ü]/g, 'u')
                    .replace(/[ß]/g, 'ss')
                    .replace(/\s+/g, '_')
                    .replace(/[^a-z0-9_]/g, '');
            };

            const speakWord = async (word) => {
                try {
                    // Stop any currently playing audio
                    if (audioRef.current) {
                        audioRef.current.pause();
                        audioRef.current.currentTime = 0;
                    }

                    const filename = getAudioFilename(word);
                    const audioPath = `audio/${filename}.m4a`;

                    const audio = new Audio(audioPath);
                    audioRef.current = audio; // Store reference

                    return new Promise((resolve, reject) => {
                        audio.onended = () => {
                            audioRef.current = null;
                            inputRef.current?.focus();
                            resolve();
                        };
                        audio.onerror = (error) => {
                            audioRef.current = null;
                            console.error(`Failed to load audio: ${audioPath}`, error);
                            reject(error);
                        };
                        audio.play().catch(reject);
                    });
                } catch (error) {
                    audioRef.current = null;
                    console.error('Failed to play word:', error);
                }
            };

            const checkSpelling = () => {
                const target = shuffledWords[currentWordIndex];
                const answer = userInput.toLowerCase().trim();
                const correct = [target, ...(ALTERNATE_SPELLINGS[target] || [])].some(w => w.toLowerCase() === answer);
                setFeedback(correct ? 'correct' : 'incorrect');
                setWordsAttempted(wordsAttempted + 1);

                // Update userData
                const newUserData = { ...userData };
                newUserData.stats.totalWordsAttempted += 1;
                if (correct) {
                    newUserData.stats.totalCorrect += 1;
                    setScore(score + 1);
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    if (newStreak > newUserData.stats.bestStreak) {
                        newUserData.stats.bestStreak = newStreak;
                    }
                } else {
                    setStreak(0);
                }
                newUserData.wordHistory = updateWordHistory(newUserData, shuffledWords[currentWordIndex], correct);
                newUserData.stats.lastPlayed = new Date().toISOString();

                // Check for achievements
                const unlockedAchievements = checkAchievements(newUserData);
                if (unlockedAchievements.length > 0) {
                    setNewAchievements(unlockedAchievements);
                }

                setUserData(newUserData);
                saveUserData(appData, newUserData);
            };

            const checkUnscramble = () => {
                const userWord = selectedLetters.map(l => l.letter).join('');
                const correct = userWord.toLowerCase() === shuffledWords[currentWordIndex].toLowerCase();
                setFeedback(correct ? 'correct' : 'incorrect');
                setWordsAttempted(wordsAttempted + 1);

                // Update userData
                const newUserData = { ...userData };
                newUserData.stats.totalWordsAttempted += 1;
                if (correct) {
                    newUserData.stats.totalCorrect += 1;
                    setScore(score + 1);
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    if (newStreak > newUserData.stats.bestStreak) {
                        newUserData.stats.bestStreak = newStreak;
                    }
                } else {
                    setStreak(0);
                }
                newUserData.wordHistory = updateWordHistory(newUserData, shuffledWords[currentWordIndex], correct);
                newUserData.stats.lastPlayed = new Date().toISOString();

                // Check for achievements
                const unlockedAchievements = checkAchievements(newUserData);
                if (unlockedAchievements.length > 0) {
                    setNewAchievements(unlockedAchievements);
                }

                setUserData(newUserData);
                saveUserData(appData, newUserData);
            };

            const checkMultipleChoice = (selectedOption) => {
                const correct = selectedOption.toLowerCase() === shuffledWords[currentWordIndex].toLowerCase();
                setFeedback(correct ? 'correct' : 'incorrect');
                setWordsAttempted(wordsAttempted + 1);

                // Update userData
                const newUserData = { ...userData };
                newUserData.stats.totalWordsAttempted += 1;
                if (correct) {
                    newUserData.stats.totalCorrect += 1;
                    setScore(score + 1);
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    if (newStreak > newUserData.stats.bestStreak) {
                        newUserData.stats.bestStreak = newStreak;
                    }
                } else {
                    setStreak(0);
                }
                newUserData.wordHistory = updateWordHistory(newUserData, shuffledWords[currentWordIndex], correct);
                newUserData.stats.lastPlayed = new Date().toISOString();

                // Check for achievements
                const unlockedAchievements = checkAchievements(newUserData);
                if (unlockedAchievements.length > 0) {
                    setNewAchievements(unlockedAchievements);
                }

                setUserData(newUserData);
                saveUserData(appData, newUserData);
            };

            const continueToNext = () => {
                if (currentWordIndex < shuffledWords.length - 1) {
                    setCurrentWordIndex(currentWordIndex + 1);
                    setUserInput('');
                    setFeedback(null);
                    setSelectedLetters([]);
                    setTimeout(() => inputRef.current?.focus(), 100);
                } else {
                    setMode('results');
                }
            };

            const resetGame = () => {
                setScore(0);
                setStreak(0);
                setWordsAttempted(0);
                setCurrentWordIndex(0);
                setUserInput('');
                setFeedback(null);
                setSelectedLetters([]);
                const filtered = filterWordsByDifficulty(WORDS, difficultyFilter);
                setShuffledWords([...filtered].sort(() => Math.random() - 0.5));
            };

            const addLetter = (letterObj) => {
                setSelectedLetters([...selectedLetters, letterObj]);
                setScrambledLetters(scrambledLetters.filter(l => l.id !== letterObj.id));
            };

            const removeLetter = (letterObj) => {
                setSelectedLetters(selectedLetters.filter(l => l.id !== letterObj.id));
                setScrambledLetters([...scrambledLetters, letterObj]);
            };

            // PROFILE SELECTOR SCREEN
            if (mode === 'profile-selector') {
                const handleSelectProfile = (profileId) => {
                    const newAppData = switchProfile(appData, profileId);
                    setAppData(newAppData);
                    setUserData(loadUserData(newAppData));
                    setMode('home');
                };

                const handleCreateProfile = () => {
                    if (newProfileName.trim()) {
                        const newAppData = createProfile(appData, newProfileName.trim(), selectedAvatar, selectedColor);
                        setAppData(newAppData);
                        setUserData(loadUserData(newAppData));
                        setShowCreateProfile(false);
                        setNewProfileName('');
                        setSelectedAvatar(AVATAR_EMOJIS[0]);
                        setSelectedColor(PROFILE_COLORS[0]);
                        setMode('home');
                    }
                };

                const handleDeleteProfile = (profileId, e) => {
                    e.stopPropagation();
                    if (appData.profiles.length <= 1) {
                        alert('Cannot delete the last profile');
                        return;
                    }
                    if (confirm('Are you sure you want to delete this profile? All progress will be lost.')) {
                        const newAppData = deleteProfile(appData, profileId);
                        setAppData(newAppData);
                        if (newAppData.currentProfileId) {
                            setUserData(loadUserData(newAppData));
                        }
                    }
                };

                if (showCreateProfile) {
                    return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-purple-400 via-pink-400 to-red-400 p-4 flex items-center justify-center' },
                        React.createElement('div', { className: 'bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full' },
                            React.createElement('h2', { className: 'text-3xl font-bold text-purple-600 mb-6 text-center' }, 'Create New Profile'),
                            React.createElement('div', { className: 'mb-6' },
                                React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, 'Name'),
                                React.createElement('input', {
                                    type: 'text',
                                    value: newProfileName,
                                    onChange: (e) => setNewProfileName(e.target.value),
                                    placeholder: 'Enter name...',
                                    className: 'w-full p-3 border-2 border-purple-300 rounded-xl focus:border-purple-500 focus:outline-none text-lg',
                                    autoFocus: true,
                                    maxLength: 20
                                })
                            ),
                            React.createElement('div', { className: 'mb-6' },
                                React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, 'Avatar'),
                                React.createElement('div', { className: 'grid grid-cols-5 gap-2' },
                                    AVATAR_EMOJIS.map(emoji =>
                                        React.createElement('button', {
                                            key: emoji,
                                            onClick: () => setSelectedAvatar(emoji),
                                            className: `text-3xl p-3 rounded-xl transition ${selectedAvatar === emoji ? 'bg-purple-200 scale-110' : 'bg-gray-100 hover:bg-gray-200'}`
                                        }, emoji)
                                    )
                                )
                            ),
                            React.createElement('div', { className: 'mb-6' },
                                React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, 'Color'),
                                React.createElement('div', { className: 'grid grid-cols-5 gap-2' },
                                    PROFILE_COLORS.map(color =>
                                        React.createElement('button', {
                                            key: color,
                                            onClick: () => setSelectedColor(color),
                                            className: `h-12 rounded-xl transition ${selectedColor === color ? 'ring-4 ring-offset-2 ring-purple-400 scale-110' : ''}`,
                                            style: { backgroundColor: `var(--tw-${color}-500, ${color})` }
                                        })
                                    )
                                )
                            ),
                            React.createElement('div', { className: 'space-y-3' },

                navigator.serviceWorker.register('./service-worker.js')
                    .then((registration) => {
                        console.log('✓ Service Worker registered:', registration.scope);

                        // Check for updates when the app comes back into view,
                        // so a new version never reloads the page mid-session
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') {
                                registration.update().catch((error) => console.warn('Service Worker update check failed:', error));
                            }
                        });
                    })
                    .catch((error) => {
                        console.error('✗ Service Worker registration failed:', error);
                    });
